[package]
name = "microdocker"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.7.2"
clap = { version = "4.5.18", features = ["derive"] }
flate2 = "1.0.34"
libc = "0.2.174"
regex = "1.10.6"
reqwest = { version = "0.12.7", features = ["json"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128" }
sha2 = "0.10.8"
tar = "0.4.42"
tokio = { version = "1.40.0", features = ["full"] }
log = "0.4.27"
env_logger = "0.11.8"
tokio-fd = "0.3.0"
futures = "0.3.33"
